<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Arena testowa wrogów — Disco Strzelnica</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../css/main.css">
<style>
  #arena{position:fixed;left:8px;top:8px;z-index:60;width:292px;max-height:calc(100% - 16px);overflow:auto;background:rgba(20,15,10,.88);color:#f4e7c5;border:1px solid #6b5640;border-radius:5px;padding:7px 9px;font:11px/1.35 system-ui,sans-serif}
  #arena h1{font-size:12px;margin:0 0 5px;color:#ffe14a}
  #arena button,#arena select,#arena input{background:#2b2218;color:#f4e7c5;border:1px solid #6b5640;border-radius:3px;padding:2px 6px;font:inherit;cursor:pointer;margin:1px 0}
  #arena button:hover{background:#44331f}
  #arena label{white-space:nowrap}
  #arena .row{display:flex;flex-wrap:wrap;gap:3px;align-items:center;margin-bottom:3px}
  #list{font:10px/1.3 ui-monospace,monospace;max-height:210px;overflow:auto;margin-top:4px;white-space:pre}
  #lbls{position:fixed;inset:0;pointer-events:none;z-index:55}
  #lbls div{position:absolute;transform:translate(-50%,-100%);font:10px/1.2 ui-monospace,monospace;color:#fff;background:rgba(0,0,0,.55);padding:0 3px;border-radius:2px;white-space:nowrap}
  #testOut{white-space:pre;font:10px/1.3 ui-monospace,monospace;margin-top:4px;max-height:200px;overflow:auto}
</style>
</head>
<body>
<!-- Arena używa prawdziwej gry (js/main.js): menu, poziom, pętla i HUD są oryginalne; panel dokłada tylko spawn, podgląd stanu AI i testy. -->
<div id="arena">
  <h1>Arena wrogów <span id="fps"></span></h1>
  <div class="row"><button id="aStart">Start (bez fal)</button><select id="aLevel"></select></div>
  <div class="row"><select id="aType"></select><label>fala <input id="aWave" type="number" value="1" min="0" max="40" style="width:42px"></label></div>
  <div class="row"><label>odl. <input id="aDist" type="number" value="16" min="3" max="60" style="width:42px"> m</label>
    <label><input id="aAware" type="checkbox"> patrol (nieświadomy)</label></div>
  <div class="row"><button id="aSpawn">Spawn 1</button><button id="aSpawn5">Spawn ×5</button><button id="aBoss">Boss</button><button id="aClear">Wyczyść</button></div>
  <div class="row"><label><input id="aGod" type="checkbox" checked> nieśmiertelny</label><label><input id="aLbl" type="checkbox" checked> etykiety AI</label>
    </div>
  <div class="row"><button id="aTests">Testy samoczynne</button><button id="aTestOne">Test typu</button></div>
  <div id="list"></div>
  <div id="testOut"></div>
</div>
<div id="lbls"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
// Markup gry pochodzi z index.html (jedno źródło prawdy): wstrzykujemy go przed załadowaniem modułów, które szukają canvasu i ekranów.
{const html=await (await fetch('../index.html')).text();document.body.insertAdjacentHTML('afterbegin',html.slice(html.indexOf('<div id="app">'),html.indexOf('<script')))}
await import('../js/main.js');
const imp=p=>import('../js/'+p);
const [{S},{DS},{opt},{P},{world},{renderer,scene,camera},{updateGame},{animateWorld},{drawFx,capturePanels},{damageEnemy},{spawnEnemy,updateEnemies},nav,{projCount},{enter}]=await Promise.all(
  ['core/state.js','core/ds.js','core/save.js','player/player.js','world/state.js','render/renderer.js','game/loop.js','world/world.js','render/comicfx.js','game/combat.js','enemies/manager.js','enemies/nav.js','enemies/proj.js','enemies/ai.js'].map(imp));

const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const A=window.ARENA={manual:/manual/.test(location.search),god:true,T:0,renderEvery:1,errs:[],dmg:0,dmgN:0,lvSkipped:0,tests:{}};
{const oe=console.error,ow=console.warn;
 console.error=(...a)=>{A.errs.push('E:'+a.join(' '));oe.apply(console,a)};console.warn=(...a)=>{A.errs.push('W:'+a.join(' '));ow.apply(console,a)};
 addEventListener('error',e=>A.errs.push('ERR:'+e.message+' @'+(e.filename||'')+':'+e.lineno));addEventListener('unhandledrejection',e=>A.errs.push('REJ:'+(e.reason&&e.reason.stack||e.reason)))}
DS.bus.on('damage',({amount})=>{A.dmg+=amount;A.dmgN++});

/* ---------- sterowanie grą ---------- */
const skipLv=()=>{const u=DS.progression&&DS.progression.ui;if(u&&u.isOpen()){u.forceClose();A.lvSkipped++}};
A.start=async(level)=>{
  if(S.mode==='warn'){$('warnFull').click();await sleep(150)}
  if(S.mode==='game'){const f=await import('../js/game/flow.js');f.quitToMenu();await sleep(50)}
  if(level&&DS.levels.has(level)){opt.level=level;DS.bus.emit('levelSelect',{level});await sleep(50)}
  $('mPlay').click();await sleep(200);
  const G=S.G;G.queue=0;G.between=1e12;G.cleared=true;G.wave=+$('aWave').value||1;
  A.setGod(A.god);P.pos.set(0,0,0);P.yaw=0;P.vel.set(0,0,0);
  if(A.manual)G.paused=true;                       // tryb ręczny: klatki robi tylko A.frame (deterministycznie)
  return G;
};
A.setGod=on=>{A.god=on;const G=S.G;if(!G)return;if(on){G.maxHp=G.hp=1e6}else{G.maxHp=G.hp=100}};
A.frame=(dt=1/30)=>{
  const G=S.G;A.T+=dt;animateWorld(A.T,dt);skipLv();
  if(S.mode==='game'&&G&&G.paused&&A.manual)updateGame(dt);
  if(!(A.fi=(A.fi||0)+1)||A.fi%A.renderEvery===0){renderer.render(scene,camera);if(G&&G.panelReq)capturePanels();drawFx(0)}   // render programowy jest wolny: testy renderują co N-tą klatkę
  else scene.updateMatrixWorld();
};
A.step=(n,dt=1/30)=>{for(let i=0;i<n;i++)A.frame(dt)};
A.stepUntil=(cond,max=900,dt=1/30)=>{for(let i=0;i<max;i++){A.frame(dt);if(cond(i))return i}return -1};
A.player=(x,z,yaw=0)=>{P.pos.set(x,0,z);P.yaw=yaw;P.vel.set(0,0,0)};
/** Punkt `d` metrów przed graczem (w kierunku patrzenia), z obrotem o `off` rad. */
A.ahead=(d,off=0)=>({x:P.pos.x-Math.sin(P.yaw+off)*d,z:P.pos.z-Math.cos(P.yaw+off)*d});
A.spawn=(type,o={})=>{
  const d=o.d===undefined?(+$('aDist').value||16):o.d;
  const at=o.at||A.ahead(d,o.off||0);
  const e=spawnEnemy(type,Object.assign({wave:+$('aWave').value||1,at,aware:o.aware===undefined?!$('aAware').checked:o.aware},o.opts||{}));
  if(o.hp){e.hp=e.maxHp=o.hp}
  return e;
};
A.clear=()=>{const G=S.G;if(!G)return;G.enemies.forEach(e=>{e.alive=false;e.dieT=99;e.g.visible=false});};
A.alive=()=>S.G.enemies.filter(e=>e.alive);
A.shoot=(e,{dmg=10,head=false,from}={})=>{
  const p=new THREE.Vector3(e.g.position.x,(head?(e.headY||1.7):1.2)*(e.g.scale.y||1),e.g.position.z);
  if(from){P.pos.set(from.x,0,from.z)}
  damageEnemy(e,dmg,head,p);
};
A.info=e=>({type:e.type,name:e.name,hp:Math.round(e.hp),max:Math.round(e.maxHp),alive:e.alive,state:e.ai&&e.ai.state,sub:e.ai&&e.ai.sub,
  sees:e.ai&&e.ai.sees,x:+e.g.position.x.toFixed(1),z:+e.g.position.z.toFixed(1),d:+Math.hypot(P.pos.x-e.g.position.x,P.pos.z-e.g.position.z).toFixed(1),phase:e.phase});
A.insideCollider=(x,z,r=.1)=>world.colliders.some(c=>x>c.x0+r&&x<c.x1-r&&z>c.z0+r&&z<c.z1-r&&(c.h===undefined||c.h>.3));
A.cost=()=>{const r=renderer;const ar=r.info.autoReset;r.info.autoReset=false;r.info.reset();r.render(scene,camera);const c={calls:r.info.render.calls,tris:r.info.render.triangles};r.info.autoReset=ar;return c};
A.nav=nav;A.proj=projCount;A.enter=enter;

/* ---------- panel ---------- */
const types=DS.enemies.ids();
$('aType').innerHTML=types.map(t=>`<option value="${t}">${DS.enemies.get(t).name||t} (${t})</option>`).join('');
$('aLevel').innerHTML=DS.levels.ids().map(l=>`<option>${l}</option>`).join('');
$('aStart').onclick=()=>A.start($('aLevel').value);
$('aSpawn').onclick=()=>A.spawn($('aType').value);
$('aSpawn5').onclick=()=>{for(let i=0;i<5;i++)A.spawn($('aType').value,{off:(i-2)*.5,d:(+$('aDist').value||16)+i*1.5})};
$('aBoss').onclick=()=>A.spawn($('aType').value,{opts:{boss:true}});
$('aClear').onclick=A.clear;
$('aGod').onchange=ev=>A.setGod(ev.target.checked);
const lbls=$('lbls'),list=$('list');let ft=0,fc=0;
setInterval(()=>{
  const G=S.G;if(!G||S.mode!=='game'){list.textContent='(brak biegu: Start)';lbls.innerHTML='';return}
  list.textContent=G.enemies.filter(e=>e.alive).slice(0,30).map(e=>{const i=A.info(e);return `${i.type.padEnd(11)} ${String(i.hp).padStart(4)}/${String(i.max).padEnd(4)} ${String(i.state).padEnd(8)} ${i.d}m`}).join('\n');
  if(!$('aLbl').checked){lbls.innerHTML='';return}
  const v=new THREE.Vector3(),w=innerWidth,h=innerHeight;let html='';
  for(const e of G.enemies){if(!e.alive)continue;v.set(e.g.position.x,2.4*(e.g.scale.y||1),e.g.position.z).project(camera);
    if(v.z>1||Math.abs(v.x)>1.1||Math.abs(v.y)>1.1)continue;
    html+=`<div style="left:${(v.x*.5+.5)*w}px;top:${(-v.y*.5+.5)*h}px">${e.type} ${e.ai?e.ai.state+(e.ai.sub?'.'+e.ai.sub:''):''} ${Math.round(e.hp)}</div>`}
  lbls.innerHTML=html;
},200);
let lastF=performance.now(),fr=0;(function f(){fr++;const n=performance.now();if(n-lastF>1000){$('fps').textContent=fr+' kl/s (render programowy: nie miarodajne)';fr=0;lastF=n}requestAnimationFrame(f)})();

/* ---------- testy samoczynne (wywołanie: ARENA.selfTest() albo przycisk) ---------- */
A.selfTest=async(only)=>{
  const mod=await import('../js/enemies/selftest.js');
  return mod.runAll(A,{S,DS,P,world,nav,scene,camera,renderer,opt,damageEnemy,spawnEnemy,updateEnemies,enter},only);
};
$('aTests').onclick=async()=>{$('testOut').textContent='trwa…';const r=await A.selfTest();$('testOut').textContent=Object.entries(r).map(([k,v])=>`${v==='PASS'?'✔':v.startsWith('info')?'·':'✘'} ${k}${v==='PASS'?'':' '+v}`).join('\n')};
$('aTestOne').onclick=async()=>{$('testOut').textContent='trwa…';const r=await A.selfTest($('aType').value);$('testOut').textContent=Object.entries(r).map(([k,v])=>`${v==='PASS'?'✔':'✘'} ${k}${v==='PASS'?'':' '+v}`).join('\n')};
A.ready=true;
</script>
</body>
</html>
